<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background elements */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
      animation: float 20s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-20px) rotate(120deg); }
      66% { transform: translateY(10px) rotate(240deg); }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(255, 255, 255, 0.2);
      padding: 48px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      transform: translateY(0);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-container:hover {
      transform: translateY(-4px);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-title {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      font-size: 16px;
      color: #666;
      font-weight: 400;
    }

    .form-group {
      position: relative;
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.8);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    .form-input:focus {
      border-color: #667eea;
      background: rgba(255, 255, 255, 1);
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      transform: translateY(-1px);
    }

    .form-input.error {
      border-color: #ef4444;
      background: rgba(254, 242, 242, 0.8);
    }

    .form-input.error:focus {
      border-color: #ef4444;
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
    }

    .error-message {
      display: none;
      color: #ef4444;
      font-size: 14px;
      margin-top: 8px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.3s ease;
    }

    .error-message.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .success-message {
      display: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .success-message.show {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .login-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .login-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
    }

    .login-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .login-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .button-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.3s ease;
    }

    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-button.loading .button-text {
      opacity: 0;
    }

    .login-button.loading .loading-spinner {
      display: block;
    }

    .forgot-password {
      text-align: center;
      margin-top: 24px;
    }

    .forgot-password a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .forgot-password a:hover {
      color: #5a67d8;
      text-decoration: underline;
    }

    .signup-link {
      text-align: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
    }

    .signup-link p {
      color: #6b7280;
      font-size: 14px;
      margin: 0;
    }

    .signup-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
      position: relative;
    }

    .signup-link a:hover {
      color: #5a67d8;
      text-decoration: underline;
    }

    .signup-link a::after {
      content: '→';
      margin-left: 4px;
      transition: transform 0.2s ease;
    }

    .signup-link a:hover::after {
      transform: translateX(2px);
    }

    .lockout-warning {
      display: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-weight: 500;
      text-align: center;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .lockout-warning.show {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    /* Responsive design */
    @media (max-width: 480px) {
      .login-container {
        margin: 20px;
        padding: 32px 24px;
        max-width: none;
      }
      
      .login-title {
        font-size: 28px;
      }
      
      .form-input {
        padding: 14px 16px;
      }
      
      .login-button {
        padding: 14px;
      }
    }

    /* Input focus animations */
    .form-group {
      position: relative;
    }

    .form-input:focus + .form-label,
    .form-input:not(:placeholder-shown) + .form-label {
      transform: translateY(-24px) scale(0.85);
      color: #667eea;
    }

    /* Micro-interactions */
    .form-input:valid {
      border-color: #10b981;
    }

    .form-input:invalid:not(:focus):not(:placeholder-shown) {
      border-color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-subtitle">Sign in to access your dashboard</p>
    </div>

    <form id="loginForm">
      <div class="success-message" id="successMessage">
        Login successful! Redirecting...
      </div>
      
      <div class="lockout-warning" id="lockoutWarning">
        Account temporarily locked due to multiple failed attempts. Please try again later.
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
        <div class="error-message" id="emailError">Please enter a valid email address</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
        <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
      </div>

      <button type="submit" class="login-button" id="loginButton">
        <div class="button-content">
          <span class="button-text">Sign In</span>
          <div class="loading-spinner"></div>
        </div>
      </button>
    </form>

    <div class="forgot-password">
      <a href="#" onclick="alert('Please contact your system administrator to reset your password.')">
        Forgot your password?
      </a>
    </div>

    <div class="signup-link">
      <p>Don't have an account? <a href="/" id="signupLink">Sign up here</a></p>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginButton = document.getElementById('loginButton');
    const successMessage = document.getElementById('successMessage');
    const lockoutWarning = document.getElementById('lockoutWarning');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    // Form validation functions
    function validateEmail(email) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    function validatePassword(password) {
      return password.length >= 6;
    }

    function showError(element, errorElement, message = null) {
      element.classList.add('error');
      errorElement.classList.add('show');
      if (message) {
        errorElement.textContent = message;
      }
    }

    function hideError(element, errorElement) {
      element.classList.remove('error');
      errorElement.classList.remove('show');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('show');
    }

    function hideSuccess() {
      successMessage.classList.remove('show');
    }

    function showLockout(message) {
      lockoutWarning.textContent = message;
      lockoutWarning.classList.add('show');
    }

    function hideLockout() {
      lockoutWarning.classList.remove('show');
    }

    function setLoading(loading) {
      if (loading) {
        loginButton.classList.add('loading');
        loginButton.disabled = true;
      } else {
        loginButton.classList.remove('loading');
        loginButton.disabled = false;
      }
    }

    // Real-time validation
    emailInput.addEventListener('input', () => {
      hideError(emailInput, emailError);
      hideLockout();
    });

    passwordInput.addEventListener('input', () => {
      hideError(passwordInput, passwordError);
      hideLockout();
    });

    // Form submission
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Clear previous messages
      hideSuccess();
      hideLockout();
      hideError(emailInput, emailError);
      hideError(passwordInput, passwordError);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      let isValid = true;

      // Client-side validation
      if (!validateEmail(email)) {
        showError(emailInput, emailError);
        isValid = false;
      }

      if (!validatePassword(password)) {
        showError(passwordInput, passwordError);
        isValid = false;
      }

      if (!isValid) {
        return;
      }

      // Set loading state
      setLoading(true);

      try {
        // Make API request to backend
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Successful login
          showSuccess(data.message || 'Login successful! Redirecting...');
          
          // Redirect after a short delay
          setTimeout(() => {
            window.location.href = '/dashboard'; // Adjust this URL as needed
          }, 1500);
          
        } else {
          // Handle different error scenarios
          if (response.status === 403) {
            // Account locked
            showLockout(data.message || 'Account temporarily locked');
          } else if (response.status === 401) {
            // Invalid credentials
            if (data.message.includes('locked')) {
              showLockout(data.message);
            } else {
              showError(passwordInput, passwordError, data.message || 'Invalid email or password');
            }
          } else {
            // Other errors
            showError(passwordInput, passwordError, data.message || 'An error occurred. Please try again.');
          }
        }
      } catch (error) {
        console.error('Login error:', error);
        showError(passwordInput, passwordError, 'Network error. Please check your connection and try again.');
      } finally {
        setLoading(false);
      }
    });

    // Add some visual polish with entrance animation
    window.addEventListener('load', () => {
      document.querySelector('.login-container').style.opacity = '0';
      document.querySelector('.login-container').style.transform = 'translateY(20px)';
      
      setTimeout(() => {
        document.querySelector('.login-container').style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
        document.querySelector('.login-container').style.opacity = '1';
        document.querySelector('.login-container').style.transform = 'translateY(0)';
      }, 100);
    });

    // Add keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        loginForm.dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
